name: Part 1 Repository Structure Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-docs-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify /docs Folder Exists
        run: |
          if [ -d "docs" ]; then
            echo "SUCCESS: /docs folder exists."
          else
            echo "ERROR: /docs folder is missing!" && exit 1
          fi

      - name: Verify ERD.png Exists
        run: |
          if [ -f "docs/ERD.png" ]; then
            echo "SUCCESS: ERD.png found."
          else
            echo "ERROR: docs/ERD.png is missing!" && exit 1
          fi

      - name: Verify schema.sql Exists
        run: |
          if [ -f "docs/schema.sql" ]; then
            echo "SUCCESS: schema.sql found."
          else
            echo "ERROR: docs/schema.sql is missing!" && exit 1
          fi

      - name: Verify API_ENDPOINT_PLAN.pdf Exists
        run: |
          if [ -f "docs/API_ENDPOINT_PLAN.pdf" ]; then
            echo "SUCCESS: API_ENDPOINT_PLAN.pdf found."
          else
            echo "ERROR: docs/API_ENDPOINT_PLAN.pdf is missing!" && exit 1
          fi